<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f3"><title>DA Study Materials</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#171717;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd;background:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.nav a{color:#2867ed;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:28px 14px 60px}.eyebrow,.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#2867ed}.hero h1{font-size:clamp(36px,6vw,58px);letter-spacing:-.05em;margin:9px 0}.hero p{max-width:800px;color:#666;line-height:1.65}.tools{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:22px 0}.tools input,.tools select{width:100%;padding:13px;border:1px solid #d8d8d5;border-radius:12px;background:#fff;font:inherit}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{border:0;background:#e8e8e5;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:#2867ed;color:#fff}.count{color:#777;margin:11px 0}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;margin:13px 0}.q{font-size:19px;line-height:1.45;margin:7px 0 15px}.answer,.example{line-height:1.65}.example,.diagram,.memory{margin-top:14px;padding:14px;border-radius:12px}.example{background:#f1f3f6}.diagram{background:#f7f7f4;border:1px solid #e2e2df;overflow:auto}.diagram svg{display:block;width:100%;height:auto;min-width:420px}.memory{border-left:4px solid #2867ed;background:#f3f6ff}.empty{padding:35px;text-align:center;color:#777}@media(max-width:650px){.tools{grid-template-columns:1fr}.wrap{padding:22px 11px}.card{padding:16px}.q{font-size:18px}}</style></head><body><header class="top"><div class="brand">📚 DA Study Materials</div><nav><a href="./">Interview</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">DATA ANALYTICS • STUDY + VISUAL LEARNING</div><h1>Learn it. See it. Explain it.</h1><p>All questions from the interview bank, with answers, practical examples, visual memory aids and concise study cues.</p></section><div class="tools"><input id="search" placeholder="Search SQL, DAX, Excel, Python…" aria-label="Search study materials"><select id="module" aria-label="Filter module"><option value="all">All modules</option></select></div><div id="tabs" class="tabs"></div><div id="count" class="count">Loading study materials…</div><section id="list"></section></main><script>
const $=id=>document.getElementById(id);let BANK={},items=[],active="all",needle="";function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function answer(m,q){const s=q.toLowerCase();const common={"Excel":"Choose the simplest Excel feature that answers the business question, validate it on a small sample, and check edge cases.","Power BI":"Build a clean model, transform data in Power Query, use DAX measures for analytical logic, and choose visuals that answer a specific business question.","MySQL":"Break the SQL into tables, joins, filters, grouping, calculations and ordering. Test NULLs, duplicates and empty results.","Python Fundamentals":"Use clear data structures, small functions and explicit edge-case handling.","Python for Data Analytics":"A reliable analytics workflow is Inspect → Clean → Transform → Validate → Analyze → Communicate."};if(m==="Excel"){if(s.includes("duplicate"))return "Identify the business key first, such as Customer ID. Use Remove Duplicates, a helper column or COUNTIF to find repeated IDs, then review which record is authoritative.";if(s.includes("10%")||s.includes("bonus"))return "Use IF, for example =IF(Sales>50000,Sales*10%,Sales*5%). Keep thresholds and rates in cells when possible.";if(s.includes("corresponding")||s.includes("customer name"))return "Use XLOOKUP when available: =XLOOKUP(CustomerID,CustomerIDRange,NameRange,\"Not found\").";if(s.includes("highlight"))return "Use Conditional Formatting with a rule such as =DueDate<TODAY() to highlight overdue invoices.";if(s.includes("january"))return "Use SUMIFS with date boundaries: SUMIFS(Sales,Date,\">=\"&DATE(2026,1,1),Date,\"<\"&DATE(2026,2,1)).";if(s.includes("top 3"))return "Use LARGE for top values or RANK.EQ for row ranking. A PivotTable is often clearer for reporting.";if(s.includes("unique customers"))return "Modern Excel can use COUNTA(UNIQUE(CustomerIDRange)); a PivotTable is another practical option.";if(s.includes("running total")||s.includes("cumulative"))return "Use =SUM($B$2:B2) and fill down to create an expanding range.";if(s.includes("working days"))return "Use NETWORKDAYS(start_date,end_date,holidays) to exclude weekends and optional holidays.";if(s.includes("division error"))return "Use IFERROR(A2/B2,\"Error\") to handle a zero denominator.";return common[m]}if(m==="Power BI"){if(s.includes("ecosystem"))return "Desktop builds reports and models; Service publishes and shares; gateways connect on-premises sources; mobile apps support consumption.";if(s.includes("power query"))return "Power Query is the preparation layer: connect, profile, clean, reshape, merge and append data before the model.";if(s.includes("star schema"))return "A star schema has a central fact table containing events or measures and surrounding dimension tables containing descriptive attributes.";if(s.includes("dax"))return "DAX is Power BI's analytical expression language. Measures calculate at query time; calculated columns are stored row-by-row.";if(s.includes("sum() and sumx"))return "SUM aggregates an existing numeric column. SUMX iterates rows, evaluates an expression for each row, then sums the results.";if(s.includes("calculate()"))return "CALCULATE evaluates an expression in a modified filter context and can add, remove or replace filters.";if(s.includes("filter context"))return "Row context means the current row. Filter context is the set of filters affecting a measure evaluation.";if(s.includes("rankx"))return "RANKX evaluates an expression across a table and assigns ranks, often for Top-N analysis.";if(s.includes("filters and slicers"))return "Filters restrict data at visual, page or report scope. Slicers expose filters interactively; drill-down moves through hierarchy levels.";return common[m]}if(m==="MySQL"){if(s.includes("main types"))return "DDL defines structure; DML changes rows; DQL reads data; DCL manages permissions; transactions use COMMIT and ROLLBACK.";if(s.includes("primary key"))return "A PRIMARY KEY uniquely identifies each row and cannot be NULL. UNIQUE also prevents duplicates but is not the primary identifier.";if(s.includes("foreign key"))return "A foreign key references a key in another table and helps enforce referential integrity.";if(s.includes("where and having"))return "WHERE filters rows before grouping. HAVING filters groups after GROUP BY.";if(s.includes("inner join")||s.includes("left join"))return "INNER JOIN keeps matching rows only. LEFT JOIN keeps every left row and fills unmatched right-side values with NULL.";if(s.includes("null = null"))return "NULL represents an unknown value, so NULL = NULL is not TRUE. Use IS NULL or IS NOT NULL.";if(s.includes("union"))return "UNION removes duplicates between compatible results; UNION ALL does not perform duplicate removal.";if(s.includes("index"))return "Indexes can speed reads, filters and joins, but use storage and add write overhead.";if(s.includes("cte"))return "A CTE is a named temporary result introduced with WITH. It improves readability and supports multi-step queries.";if(s.includes("normalization"))return "1NF uses atomic values; 2NF removes partial dependency; 3NF removes transitive dependency.";return common[m]}if(m==="Python Fundamentals"){if(s.includes("numeric strings"))return "Use pandas.to_numeric(..., errors=\"coerce\") and decide how to handle resulting NaN values.";if(s.includes("duplicate list"))return "Use dict.fromkeys(values) to remove duplicates while preserving order, or maintain a seen set.";if(s.includes("last 7 days"))return "Use values[-7:] to return the final seven items.";if(s.includes("enumerate"))return "enumerate(items) gives index and value together.";if(s.includes("list comprehension"))return "[x*x for x in numbers] expresses a simple transformation compactly.";if(s.includes("no return"))return "A function without an explicit return returns None.";if(s.includes("set"))return "Sets store unique values and support intersection (&), union (|) and difference (-).";return common[m]}if(m==="Python for Data Analytics"){if(s.includes("list and a numpy"))return "A Python list is a general-purpose container. A NumPy array is optimized for homogeneous numerical data and vectorized operations.";if(s.includes("arange")||s.includes("linspace"))return "arange uses a step size; linspace chooses the number of evenly spaced values.";if(s.includes("reshape")||s.includes("resize"))return "reshape changes dimensions without changing element count; resize can change total size.";if(s.includes("loc and iloc"))return "loc selects by labels; iloc selects by integer positions.";if(s.includes("boolean indexing"))return "A boolean mask contains True/False per row; applying it keeps the True rows.";if(s.includes("missing values"))return "Use isna()/isnull() to measure missingness, then drop or fill based on business meaning.";if(s.includes("value_counts"))return "value_counts() counts distinct values and is useful for categorical distributions.";if(s.includes("merge(), concat"))return "merge combines by keys; concat stacks along an axis; join is convenient for index-based combinations.";return common[m]}return "Start with the definition, explain why it matters, give a small example, mention one edge case, and connect it to the business outcome."}
function example(m,q){const s=q.toLowerCase();if(s.includes("join"))return "Customers C1,C2,C3 and Orders C1,C1,C3: a LEFT JOIN keeps all customers; C2 gets NULL order fields.";if(s.includes("group by"))return "South=100, South=50, North=80 → GROUP BY region gives South=150 and North=80.";if(s.includes("star schema"))return "FactSales stores Sales and Quantity; DimDate, DimProduct and DimCustomer describe and filter those facts.";if(s.includes("filter")||s.includes("where"))return "If Sales > 1,000 is the rule, only rows meeting that condition remain.";if(s.includes("rank"))return "Sales 900, 700, 500 → ranks 1, 2, 3 highest to lowest.";if(s.includes("loc")||s.includes("iloc"))return 'df.loc["A"] selects label A; df.iloc[0] selects the first row by position.';return "Take five sample rows, apply the technique, compare the output with what you expect, then scale to the full dataset."}
function diagram(m,q){const s=q.toLowerCase();let title,boxes;if(s.includes("star schema")){title="Star schema";boxes=["DimDate","DimProduct","FactSales","DimCustomer"]}else if(s.includes("join")){title="Join";boxes=["Table A","JOIN","Table B"]}else if(m==="Power BI"&&s.includes("calculate")){title="DAX context";boxes=["Slicer","Filter context","CALCULATE","Measure"]}else if(m==="Power BI"&&(s.includes("power query")||s.includes("data sources"))){title="Power BI pipeline";boxes=["Source","Power Query","Model","Report"]}else if(m==="MySQL"){title="SQL reasoning";boxes=["FROM / JOIN","WHERE","GROUP BY","SELECT","ORDER BY"]}else if(m.startsWith("Python")){title="Analytics workflow";boxes=["Load","Inspect","Clean","Analyze","Explain"]}else if(m==="Excel"){title="Excel workflow";boxes=["Data","Formula / Tool","Check","Result"]}else{title="Concept flow";boxes=["Input","Concept","Application","Result"]}const w=boxes.length*175+20;return `<svg viewBox="0 0 ${w} 170" role="img" aria-label="${esc(title)}"><text x="20" y="28" font-size="16" font-weight="800">${esc(title)}</text>${boxes.map((b,i)=>{const x=20+i*175;const mid=Math.floor(boxes.length/2);return `<rect x="${x}" y="65" width="140" height="58" rx="12" fill="${i===mid?"#eaf2ff":"#fff"}" stroke="${i===mid?"#2867ed":"#b9bdc3"}" stroke-width="${i===mid?2.5:1.5}"/><text x="${x+70}" y="100" text-anchor="middle" font-size="15" font-weight="700">${esc(b)}</text>${i<boxes.length-1?`<path d="M${x+145} 94 H${x+166}" stroke="#777" stroke-width="3"/><path d="M${x+157} 86 L${x+168} 94 L${x+157} 102" fill="none" stroke="#777" stroke-width="3"/>`:""}`}).join("")}</svg>`}
function memory(m,q){const s=q.toLowerCase();if(s.includes("where")&&s.includes("having"))return "WHERE = rows first. HAVING = groups later.";if(s.includes("sum()")||s.includes("sumx"))return "SUM adds a column. SUMX iterates rows + expression.";if(s.includes("row context")||s.includes("filter context"))return "Row context = current row. Filter context = active filters.";if(s.includes("loc")||s.includes("iloc"))return "loc = label. iloc = integer position.";if(s.includes("merge")||s.includes("join"))return "Join = combine related tables. Concat = stack.";if(s.includes("primary key"))return "Primary key = unique identity.";if(s.includes("power query"))return "Power Query = prepare data before the model.";return "Explain → example → edge case → business impact."}
function render(){const f=items.filter(x=>(active==="all"||x.m===active)&&(!needle||(`${x.q} ${answer(x.m,x.q)}`).toLowerCase().includes(needle)));$("count").textContent=`Showing ${f.length} of ${items.length} questions`;$('list').innerHTML=f.length?f.map(x=>`<article class="card"><div class="label">${esc(x.m)} • Question ${x.n}</div><h2 class="q">${esc(x.q)}</h2><div class="label">Interview-ready answer</div><div class="answer">${esc(answer(x.m,x.q))}</div><div class="example"><div class="label">Simple example</div>${esc(example(x.m,x.q))}</div><div class="diagram"><div class="label">Visual explanation</div>${diagram(x.m,x.q)}</div><div class="memory"><strong>Remember:</strong> ${esc(memory(x.m,x.q))}</div></article>`).join(""): '<div class="empty">No matching study material.</div>'}
function nav(){const ms=Object.keys(BANK);$("module").innerHTML='<option value="all">All modules</option>'+ms.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");$("tabs").innerHTML=['all',...ms].map(m=>`<button class="tab ${m===active?"active":""}" data-m="${esc(m)}">${m==="all"?"All":esc(m)}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=b.dataset.m;$("module").value=active;nav();render()})}
async function init(){try{const r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)throw Error('bank unavailable');const t=await r.text();const start=t.indexOf('const BANK=');if(start<0)throw Error('bank marker missing');const exprStart=start+'const BANK='.length;const end=t.indexOf(';',exprStart);if(end<0)throw Error('bank terminator missing');const raw=t.slice(exprStart,end).trim();BANK=Function('return ('+raw+')')();if(!BANK||typeof BANK!=="object")throw Error('invalid bank');items=[];Object.keys(BANK).forEach(m=>(Array.isArray(BANK[m])?BANK[m]:[]).forEach((q,i)=>items.push({m,n:i+1,q:String(q)})));nav();render()}catch(e){console.error(e);$("count").textContent='Could not load the question bank. Please refresh the page.';$('list').innerHTML='<div class="empty">The study page could not load the interview bank. Please refresh once the latest GitHub Pages deployment is live.</div>'}}
$("search").oninput=e=>{needle=e.target.value.toLowerCase().trim();render()};$("module").onchange=e=>{active=e.target.value;nav();render()};init();</script></body></html>
