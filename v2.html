<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>DA Interview Practice</title><style>body{margin:0;background:#f6f6f3;color:#171717;font:15px system-ui}main{max-width:900px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}select,textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:11px;padding:12px;font:inherit}textarea{min-height:180px}button{border:0;border-radius:10px;padding:11px 15px;background:#171717;color:white;font-weight:700;cursor:pointer}.secondary{background:#eee;color:#171717}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{height:6px;background:#eee;border-radius:99px;margin:16px 0}.bar i{display:block;height:100%;background:#171717;width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{background:#f2f2ee;padding:12px;border-radius:12px}@media(max-width:600px){main{padding:14px 10px}.grid{grid-template-columns:1fr}h2{font-size:21px}}</style></head><body><main><section id="home" class="card"><small>DATA ANALYTICS</small><h1>Interview Practice</h1><p>Mock interview mode with voice input, coaching score, module tracking and local history.</p><div class="grid"><select id="focus"><option value="all">All modules</option><option>Excel</option><option>Power BI</option><option>MySQL</option><option>Python</option></select><select id="len"><option>5</option><option selected>10</option><option>15</option><option>25</option><option>50</option></select></div><button id="go">Start interview</button><p class="stats">Sessions completed: <b id="hc">0</b> · 2 minutes per question</p></section><section id="interview" class="card hidden"><div class="top"><b id="mod"></b><span id="prog"></span><b id="time">02:00</b></div><div class="bar"><i id="bar"></i></div><h2 id="q"></h2><p id="coach"></p><textarea id="a" placeholder="Answer as if you were speaking to an interviewer..."></textarea><div class="actions"><button class="secondary" id="mic">🎙 Speak answer</button><button class="secondary" id="read">🔊 Read question</button><button class="secondary" id="skip">Skip</button><button id="next">Submit</button></div><p id="note"></p></section><section id="result" class="card hidden"><small>SESSION COMPLETE</small><h2 id="verdict"></h2><div id="score"></div><div id="breakdown"></div><button id="again">Try another</button></section></main><script>
const SOURCE='https://raw.githubusercontent.com/Nidhishpp/da-interview-practice/f43341edac433946f79efc829a38a4f38612b327/index.html';let BANK=[];const $=id=>document.getElementById(id);let pool=[],i=0,answers=[],timer=null,sec=120;
function loadBank(){return fetch(SOURCE).then(r=>r.text()).then(s=>{const m=s.match(/const qs=(\[[\s\S]*?\]);let/);if(!m)throw Error();BANK=JSON.parse(m[1])}).catch(()=>{BANK=[['Data Analytics','Tell me how you would approach a new data analysis problem.']]})}
function start(){const f=$('focus').value,n=+$('len').value;let c=BANK.filter(x=>f==='all'||x[0].toLowerCase().includes(f.toLowerCase()));if(c.length<n)c=BANK;pool=[...c].sort(()=>Math.random()-.5).slice(0,n);i=0;answers=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('interview').classList.remove('hidden');show()}
function show(){clearInterval(timer);sec=120;$('a').value='';$('note').textContent='';$('mod').textContent=pool[i][0];$('prog').textContent=`Question ${i+1} of ${pool.length}`;$('bar').style.width=`${i/pool.length*100}%`;$('q').textContent=pool[i][1];$('coach').textContent=i?'Follow-up mindset: be precise, explain why, and mention trade-offs when relevant.':'Welcome. Answer naturally and explain your reasoning.';clock();timer=setInterval(()=>{sec--;clock();if(sec<=0)submit(true)},1000)}
function clock(){$('time').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function score(text,q){if(!text)return 0;let w=text.trim().split(/\s+/).length,terms=(q.match(/[A-Za-z][A-Za-z0-9_() -]{2,}/g)||[]).filter(x=>x.length>3).slice(0,8),hits=terms.filter(x=>text.toLowerCase().includes(x.toLowerCase())).length;return Math.min(100,Math.round(Math.min(45,w*1.5)+Math.min(45,hits/Math.max(terms.length,1)*45)+(w>=18?10:w>=8?7:4)))}
function submit(timeout=false){clearInterval(timer);answers.push({q:pool[i],text:$('a').value.trim(),timeout});if(i===pool.length-1)finish();else{i++;show()}}
function finish(){let ss=answers.map(x=>score(x.text,x.q[1])),o=Math.round(ss.reduce((a,b)=>a+b,0)/Math.max(1,ss.length)),by={};answers.forEach((x,k)=>(by[x.q[0]]??=[]).push(ss[k]));let h=[];try{h=JSON.parse(localStorage.getItem('daInterviewHistory')||'[]')}catch(e){}h.push({date:new Date().toISOString(),score:o,questions:pool.length});try{localStorage.setItem('daInterviewHistory',JSON.stringify(h.slice(-30)))}catch(e){}$('interview').classList.add('hidden');$('result').classList.remove('hidden');$('verdict').textContent=o>=80?'Strong interview round':o>=60?'Promising — sharpen weak areas':'Needs more practice';$('score').innerHTML=`<h3 style="font-size:44px;margin:10px 0">${o}/100</h3><p>Free coaching score based on answer completeness and concept coverage. It is not an AI correctness judgment.</p>`;$('breakdown').innerHTML='<b>Module performance</b>'+Object.entries(by).map(([m,a])=>`<p>${m}: <strong>${Math.round(a.reduce((x,y)=>x+y,0)/a.length)}%</strong></p>`).join('')}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('note').textContent='Speech recognition is not supported in this browser. Type your answer instead.';return}const r=new R;r.lang='en-IN';r.interimResults=false;r.onstart=()=>$('note').textContent='Listening…';r.onresult=e=>$('a').value=e.results[0][0].transcript;r.onerror=()=>$('note').textContent='Microphone input stopped. Check browser permission.';r.onend=()=>$('note').textContent='Voice capture finished. Review before submitting.';r.start()}
$('go').onclick=()=>loadBank().then(start);$('next').onclick=()=>submit();$('skip').onclick=()=>{$('a').value='';submit()};$('again').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};$('mic').onclick=voice;$('read').onclick=()=>speechSynthesis.speak(new SpeechSynthesisUtterance($('q').textContent));try{$('hc').textContent=JSON.parse(localStorage.getItem('daInterviewHistory')||'[]').length}catch(e){}
</script></body></html>
